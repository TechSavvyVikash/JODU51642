<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:linear-gradient(135deg,#0d1117,#161b22);
    color:#fff;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    z-index:2;
}

.logo{
    width:180px;
    margin-bottom:25px;
    animation:float 4s ease-in-out infinite;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
    text-shadow:0 0 20px rgba(88,166,255,.5);
}

p{
    color:#b0b0b0;
    font-size:1.2rem;
    margin-bottom:30px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:35px;
}

.box{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:20px;
    min-width:90px;
}

.box span{
    display:block;
    font-size:2rem;
    font-weight:bold;
}

.box small{
    color:#aaa;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    background:#238636;
    color:white;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* Background Glow */
.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(200px);
    opacity:.15;
    border-radius:50%;
    animation:pulse 6s infinite alternate;
}

.router{
    width:320px;
    margin:20px auto;
    display:block;
    animation:float 5s ease-in-out infinite;
    filter:drop-shadow(0 0 25px rgba(88,166,255,.4));
}    

.query-btn{
    margin-left:10px;
    background:#2563eb;
}




    
@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.3);}
}

@media(max-width:768px){
    h1{font-size:2.5rem;}
    .countdown{
        flex-wrap:wrap;
    }
}


.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup-box{
    width:90%;
    max-width:500px;
    background:#161b22;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(88,166,255,.25);
}

.popup-box h2{
    margin-bottom:15px;
}

.popup-box input,
.popup-box textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    background:#0d1117;
    color:white;
}

.submit-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#238636;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:22px;
}

    
    
</style>
</head>
<body>

<div class="glow"></div>

<div class="container">

    <!-- Replace with your logo/image -->
    <img src="images/logo.png" class="logo" alt="Logo">
    <img src="images/router.png" class="router" alt="Router">

    <h1>COMING SOON</h1>

    <p>We're building something amazing. Stay tuned for the launch.</p>

    <div class="countdown">
        <div class="box">
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div class="box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>
    </div>
<div style="margin-bottom:30px">

<p>
Next generation wireless internet
experience is on the way.
</p>

<p>
Get notified when services launch
and submit your device-related
queries.
</p>

</div>
    <button class="btn" onclick="openSubscribe()">
Notify Me
</button>

<button class="btn query-btn"
onclick="openQuery()">
Submit Query
</button>

</div>


<div id="subscribePopup" class="popup">

<div class="popup-box">

<span class="close"
onclick="closeSubscribe()">
✕
</span>

<h2>Subscribe For Updates</h2>

<form
action="https://formspree.io/f/YOUR_FORM_ID"
method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="tel"
name="whatsapp"
placeholder="WhatsApp Number"
required>

<button type="submit"
class="submit-btn">
Subscribe
</button>

</form>

</div>
</div>


<div id="queryPopup" class="popup">

<div class="popup-box">

<span class="close"
onclick="closeQuery()">
✕
</span>

<h2>Support Query</h2>

<form
action="https://formspree.io/f/YOUR_FORM_ID"
method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="tel"
name="whatsapp"
placeholder="WhatsApp Number"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="text"
name="device"
placeholder="Device Name">

<input
type="text"
name="model"
placeholder="Model Number">

<textarea
name="question"
placeholder="Your Question"
rows="4"
required></textarea>

<textarea
name="suggestion"
placeholder="Suggestions"
rows="3"></textarea>

<button
type="submit"
class="submit-btn">
Submit Query
</button>

</form>

</div>
</div>
    





    
<script>
// Launch date
const launchDate = new Date("2026-08-31 00:00:00").getTime();

setInterval(()=>{
    const now = new Date().getTime();
    const distance = launchDate - now;

    document.getElementById("days").innerText =
        Math.floor(distance/(1000*60*60*24));

    document.getElementById("hours").innerText =
        Math.floor((distance%(1000*60*60*24))/(1000*60*60));

    document.getElementById("minutes").innerText =
        Math.floor((distance%(1000*60*60))/(1000*60));

    document.getElementById("seconds").innerText =
        Math.floor((distance%(1000*60))/1000);

},1000);




    
</script>

</body>
</html>
