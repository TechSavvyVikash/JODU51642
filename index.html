<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:linear-gradient(135deg,#0d1117,#161b22);
    color:#fff;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    z-index:2;
}

.logo{
    width:180px;
    margin-bottom:25px;
    animation:float 4s ease-in-out infinite;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
    text-shadow:0 0 20px rgba(88,166,255,.5);
}

p{
    color:#b0b0b0;
    font-size:1.2rem;
    margin-bottom:30px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:35px;
}

.box{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:20px;
    min-width:90px;
}

.box span{
    display:block;
    font-size:2rem;
    font-weight:bold;
}

.box small{
    color:#aaa;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    background:#238636;
    color:white;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* Background Glow */
.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(200px);
    opacity:.15;
    border-radius:50%;
    animation:pulse 6s infinite alternate;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.3);}
}

@media(max-width:768px){
    h1{font-size:2.5rem;}
    .countdown{
        flex-wrap:wrap;
    }
}
</style>
</head>
<body>

<div class="glow"></div>

<div class="container">

    <!-- Replace with your logo/image -->
    <img src="logo.png" class="logo" alt="Logo">

    <h1>COMING SOON</h1>

    <p>We're building something amazing. Stay tuned for the launch.</p>

    <div class="countdown">
        <div class="box">
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div class="box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>
    </div>

    <a href="#" class="btn">Notify Me</a>

</div>

<script>
// Launch date
const launchDate = new Date("2026-08-31 00:00:00").getTime();

setInterval(()=>{
    const now = new Date().getTime();
    const distance = launchDate - now;

    document.getElementById("days").innerText =
        Math.floor(distance/(1000*60*60*24));

    document.getElementById("hours").innerText =
        Math.floor((distance%(1000*60*60*24))/(1000*60*60));

    document.getElementById("minutes").innerText =
        Math.floor((distance%(1000*60*60))/(1000*60));

    document.getElementById("seconds").innerText =
        Math.floor((distance%(1000*60))/1000);

},1000);
</script>

</body>
</html>
