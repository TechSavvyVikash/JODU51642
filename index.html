<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:linear-gradient(135deg,#0d1117,#161b22);
    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    margin:0;
}

.container{
    text-align:center;

    width:100%;
    max-width:1000px;

    margin:auto;

    padding:40px 20px;

    position:relative;
    z-index:2;
}

.logo{
    position:fixed;
    top:20px;
    left:20px;
    width: 100px;;
    height: 90px;
    z-index:1000;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
    text-shadow:0 0 20px rgba(88,166,255,.5);
}

p{
    color:#b0b0b0;
    font-size:1.2rem;
    margin-bottom:30px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.box{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:20px;
    min-width:90px;
}

.box span{
    display:block;
    font-size:2rem;
    font-weight:bold;
}

.box small{
    color:#aaa;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    background:#238636;
    color:white;
    text-decoration:none;
    border-radius:12px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* Background Glow */
.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(200px);
    opacity:.15;
    border-radius:50%;
    animation:pulse 6s infinite alternate;
}

.router{
    width:min(320px,80vw);

    margin:20px auto;

    display:block;

    animation:float 5s ease-in-out infinite;

    filter:drop-shadow(0 0 25px rgba(88,166,255,.4));
}   

.query-btn{
    margin-left:10px;
    background:#2563eb;
}




    
@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.3);}
}

@media(max-width:768px){
    h1{font-size:2.5rem;}
    .countdown{
        flex-wrap:wrap;
    }
}


/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;

    background:rgba(0,0,0,.85);

    display:none;

    justify-content:center;
    align-items:center;

    overflow-y:auto;

    padding:20px;

    z-index:9999;
}

/* POPUP BOX */
.popup-box{
    width:95%;
    max-width:500px;

    background:#161b22;

    padding:25px;

    border-radius:20px;

    box-shadow:0 0 30px rgba(88,166,255,.25);

    max-height:90vh;

    overflow-y:auto;

    position:relative;
}

/* TITLE */
.popup-box h2{
    margin-bottom:15px;
    text-align:center;
}

/* INPUTS */
.popup-box input,
.popup-box textarea{

    width:100%;

    padding:12px;

    margin:8px 0;

    border:none;

    border-radius:10px;

    background:#0d1117;

    color:white;

    outline:none;

    font-size:15px;
}

.popup-box textarea{
    resize:vertical;
}

/* SUBMIT BUTTON */
.submit-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#238636;

    color:white;

    cursor:pointer;

    margin-top:10px;

    font-size:16px;

    transition:.3s;
}

.submit-btn:hover{
    transform:scale(1.02);
}

/* CLOSE BUTTON */
.close{

    position:absolute;

    top:15px;

    right:18px;

    cursor:pointer;

    font-size:24px;

    color:white;
}

/* SCROLLBAR */
.popup-box::-webkit-scrollbar{
    width:6px;
}

.popup-box::-webkit-scrollbar-thumb{
    background:#58a6ff;
    border-radius:10px;
}

/* MOBILE */
@media(max-width:768px){

.popup-box{
    width:100%;
    padding:20px;
}

.popup-box input,
.popup-box textarea{
    font-size:16px;
}

.submit-btn{
    padding:14px;
}

}
.slider{
    position:relative;

    width:100%;
    height:320px;

    margin: auto;

    overflow:hidden;
}

.slide{

    position:absolute;

    left:40%;
    top:18%;

    transform:translate(-50%,-50%);

    width:min(350px,80vw);

    opacity:0;

    transition:all .8s ease;

    filter:drop-shadow(
        0 0 25px rgba(88,166,255,.4)
    );
}

.slide.active{
    opacity:1;
    animation:float 4s ease-in-out infinite;
}
    .slide{
    max-height:240px;
    width:auto;
}


</style>
</head>
<body>

<div class="glow"></div>

<div class="container">

    <!-- Replace with your logo/image -->
    <img src="images/logo.png" class="logo" alt="Logo">
   <div class="slider">

    <img src="images/router1.png" class="slide active">

    <img src="images/router2.png" class="slide">

    <img src="images/router3.png" class="slide">
       
    <img src="images/router4.png" class="slide">

</div>
    <h1>COMING SOON</h1>

    <p>We're building something amazing. Stay tuned for the launch.</p>

    <div class="countdown">
        <div class="box">
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div class="box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>
    </div>
<div style="margin-bottom:30px">

<p>
Next generation wireless internet
experience is on the way.
</p>

<p>
Get notified when services launch
and submit your device-related
queries.
</p>

</div>
    <button class="btn" onclick="openSubscribe()">
Notify Me
</button>

<button class="btn query-btn"
onclick="openQuery()">
Submit Query
</button>

</div>


<div id="subscribePopup" class="popup">

<div class="popup-box">

<span class="close"
onclick="closeSubscribe()">
✕
</span>

<h2>Subscribe For Updates</h2>

<form
action="https://formspree.io/f/YOUR_FORM_ID"
method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="tel"
name="whatsapp"
placeholder="WhatsApp Number"
required>

<button type="submit"
class="submit-btn">
Subscribe
</button>

</form>

</div>
</div>


<div id="queryPopup" class="popup">

<div class="popup-box">

<span class="close"
onclick="closeQuery()">
✕
</span>

<h2>Support Query</h2>

<form
action="https://formspree.io/f/YOUR_FORM_ID"
method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="tel"
name="whatsapp"
placeholder="WhatsApp Number"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="text"
name="device"
placeholder="Device Name">

<input
type="text"
name="model"
placeholder="Model Number">

<textarea
name="question"
placeholder="Your Question"
rows="4"
required></textarea>

<textarea
name="suggestion"
placeholder="Suggestions"
rows="3"></textarea>

<button
type="submit"
class="submit-btn">
Submit Query
</button>

</form>

</div>
</div>
    





    
<script>
// Launch date
const launchDate = new Date("2026-08-31 00:00:00").getTime();

setInterval(()=>{
    const now = new Date().getTime();
    const distance = launchDate - now;

    document.getElementById("days").innerText =
        Math.floor(distance/(1000*60*60*24));

    document.getElementById("hours").innerText =
        Math.floor((distance%(1000*60*60*24))/(1000*60*60));

    document.getElementById("minutes").innerText =
        Math.floor((distance%(1000*60*60))/(1000*60));

    document.getElementById("seconds").innerText =
        Math.floor((distance%(1000*60))/1000);

},1000);


function openSubscribe(){
    document.getElementById("subscribePopup").style.display="flex";
}

function closeSubscribe(){
    document.getElementById("subscribePopup").style.display="none";
}

function openQuery(){
    document.getElementById("queryPopup").style.display="flex";
}

function closeQuery(){
    document.getElementById("queryPopup").style.display="none";
}


window.onclick=function(event){

if(event.target==document.getElementById("subscribePopup")){
closeSubscribe();
}

if(event.target==document.getElementById("queryPopup")){
closeQuery();
}

}
 const slides =
document.querySelectorAll('.slide');

let current = 0;

function nextSlide(){

slides[current]
.classList.remove('active');

current++;

if(current >= slides.length){
current = 0;
}

slides[current]
.classList.add('active');

}

setInterval(nextSlide,3000);   
</script>

</body>
</html>
